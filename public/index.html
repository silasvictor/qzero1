<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100%}
button,input,select{font:inherit;color:inherit}a{color:var(--p);text-decoration:none}

.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(112,71,235,.07)}

.hero{padding:6vh 5vw;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;background:linear-gradient(160deg,var(--lav),var(--bg))}

.map{position:relative;height:340px;border-radius:20px;overflow:hidden;background:#f2efe9;border:1px solid var(--bd)}.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-100%);background:var(--p);color:#fff;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;border:0;cursor:pointer;white-space:nowrap}.pin.sel{background:var(--tq);outline:3px solid #35c6c055}.pin.off{background:#999}
.pg{width:150px;aspect-ratio:1/1.41;background:#fff;border:1px solid var(--bd);border-radius:6px;position:relative;color:#333;display:grid;place-items:center;font-size:12px;overflow:hidden}
.pg:after{content:"✂ tracking code margin";position:absolute;left:0;right:0;bottom:0;height:16%;border-top:2px dotted var(--p);background:var(--lav);font-size:9px;display:grid;place-items:center;color:var(--p)}

.slots{display:flex;flex-wrap:wrap;gap:8px}.slots button{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.slots button.sel{background:var(--p);color:#fff}.slots button:disabled{opacity:.4;cursor:not-allowed}

.tab{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.code{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:1px;color:var(--dp)}
.side .logo i{background:none;font-size:32px;width:auto;height:auto}
.side{padding:22px 16px;gap:6px}.side a{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:14px}.side a.on{background:linear-gradient(90deg,#7b50ef,#6a3fe0);box-shadow:0 8px 18px rgba(112,71,235,.35)}.side a b{font-weight:400;width:20px;text-align:center;font-size:18px}
.sr{flex:1;display:flex;align-items:center;gap:10px;background:#ece8fb;border-radius:99px;padding:0 22px;color:#17152F}.sr input{max-width:none;border:0;background:transparent;padding:15px 0;outline:0;color:#17152F}
.bell{position:relative;width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:18px}.bell b{position:absolute;top:-3px;right:-3px;background:#ef4444;color:#fff;border-radius:50%;width:19px;height:19px;font-size:11px;display:grid;place-items:center}
.top .av{width:48px;height:48px;background:#5b4a8f;cursor:pointer;font-size:18px}
.ban{position:relative;overflow:hidden;display:block;background:linear-gradient(110deg,#efe9ff,#d9ccff 60%,#c5b3f5);padding:30px;border-radius:24px}.ban h2{font-size:40px;font-weight:800}.ban p{font-size:20px;color:var(--mut);margin:4px 0 22px}

.acts{position:relative;display:flex;gap:14px;flex-wrap:wrap}.acts button{background:#ffffffd9;color:#17152F;border:0;border-radius:99px;padding:12px 24px 12px 12px;display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(112,71,235,.14)}.acts button span{width:38px;height:38px;border-radius:50%;background:var(--lav);display:grid;place-items:center;color:var(--p)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fi{width:38px;height:38px;border-radius:8px;background:#ef4565;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}.fi.dc{background:#3b82f6}
.tk{display:grid;grid-template-columns:44px 1.4fr 1.1fr 1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--bd)}
.qa{background:linear-gradient(160deg,#e6dcff,#d3c3fa);color:#17152F}.qa .g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qa .g button{background:#ffffffe0;border:0;border-radius:12px;padding:16px 6px;font-weight:600;cursor:pointer;font-size:13px;color:#17152F;line-height:1.6}
.kio{width:70px;height:92px;border-radius:14px;background:linear-gradient(#f4f1ff,#cfc3f5);position:relative;flex:none}.kio:before{content:"";position:absolute;inset:10px 10px 40px;border-radius:8px;background:#6a55b0}
.promo{background:linear-gradient(160deg,#8a63f2,#6a3fe0);color:#fff;border-radius:20px;padding:20px;margin:12px 0}.promo h4{margin:0 0 4px;font-size:21px}.promo button{background:#fff;color:#17152F;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;margin-top:34px}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{background:var(--card);width:106px;height:106px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mut)}.ring b{font-size:26px;color:var(--tx);display:block}
.lg{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0}.lg i{width:10px;height:10px;border-radius:50%}.lg span{flex:1}
.pill.ok{background:#22c55e22;color:#15803d}.pill.bl{background:#3b82f622;color:#2563eb}.pill.gy{background:#e8e6f3;color:#555}
@media(max-width:860px){.tk{grid-template-columns:44px 1fr auto}.tk .hm{display:none}.two{grid-template-columns:1fr}.chip{display:none}.ban h2{font-size:30px}.side .promo{display:none}}
@media(max-width:860px){.hero,.cols{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.side a{white-space:nowrap}.side .logo{display:none}.main{padding:14px}}
body{background:radial-gradient(1100px 560px at 85% -10%,#e2d6ff 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#d4f3f1 0,transparent 55%),var(--bg);background-attachment:fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(1000px 500px at 85% -10%,#43308a66,transparent 60%),var(--bg)}}
.app:before,.app:after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(70px);opacity:.45;pointer-events:none}
.app:before{width:380px;height:380px;background:#b9a2ff;top:-80px;right:8%;animation:drift 14s ease-in-out infinite alternate}
.app:after{width:320px;height:320px;background:#8fe3dc;bottom:-100px;left:30%;animation:drift 18s ease-in-out infinite alternate-reverse}
.main{position:relative;z-index:1;background:linear-gradient(180deg,#e9e0ff88,transparent 340px)}.side{z-index:2}
@keyframes drift{to{transform:translate(-70px,50px) scale(1.18)}}
@keyframes up{from{opacity:0;transform:translateY(20px)}}
@keyframes bob{50%{transform:translateY(-7px)}}
@keyframes shim{50%{background-position:100% 50%}}
@keyframes ringin{from{transform:rotate(-140deg) scale(.7);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes ping{0%{box-shadow:0 0 0 0 #35c6c0aa}100%{box-shadow:0 0 0 18px #35c6c000}}
@keyframes wig{0%,60%,100%{rotate:0deg}10%{rotate:16deg}20%{rotate:-14deg}30%{rotate:10deg}40%{rotate:-6deg}}
@keyframes twk{from{opacity:.3}to{opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes toast{from{opacity:0;transform:translate(-50%,24px) scale(.95)}}
@keyframes chip{0%,12%{background:var(--p);color:#fff;transform:translateY(-3px)}22%,100%{background:var(--card);color:var(--tx)}}
.fresh .card,.fresh .ban,.fresh .hero>*{animation:up .65s cubic-bezier(.2,.8,.2,1) both}
.fresh .stack>:nth-child(2){animation-delay:.12s}.fresh .stack>:nth-child(3){animation-delay:.24s}.fresh .cols>.stack:nth-child(2)>*{animation-delay:.18s}.fresh .ban{animation-delay:.05s}
.card{transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(112,71,235,.17)}
.btn{transition:transform .2s,box-shadow .2s,background .2s}.btn:hover{box-shadow:0 8px 20px rgba(112,71,235,.4)}.btn:active{transform:scale(.95)}
.side a{transition:.2s}.side a:hover{transform:translateX(4px)}
.ban:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 28%,#fffa 0 3px,transparent 4px),radial-gradient(circle at 58% 72%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 86% 18%,#fffa 0 3px,transparent 4px),radial-gradient(circle at 40% 15%,#fff9 0 2px,transparent 3px);animation:twk 3s ease-in-out infinite alternate}
.chip{animation:bob 4s ease-in-out infinite}.bld{animation:drift 10s ease-in-out infinite alternate}.bell{animation:wig 3.5s 1s infinite}
.acts button{transition:transform .2s,box-shadow .2s}.acts button:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 12px 26px rgba(112,71,235,.3)}
.qa .g button{transition:.2s}.qa .g button:hover{transform:translateY(-3px) scale(1.04);background:#fff;box-shadow:0 8px 18px rgba(112,71,235,.25)}
.promo{position:relative;overflow:hidden}.promo:after{content:"🖨️";position:absolute;right:12px;bottom:10px;font-size:50px;animation:bob 3s ease-in-out infinite}.kio{animation:bob 3.5s ease-in-out infinite}
.fresh .ring{animation:ringin 1s cubic-bezier(.2,.8,.2,1) .3s both}.fresh .tl div.d{transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) .2s both}
.tk{padding-left:8px;padding-right:8px;border-radius:12px;transition:background .2s}.tk:hover,.row:hover{background:var(--lav)}
.pill.bl:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#3b82f6;margin-right:6px;animation:blink 1.2s infinite}
.pin{transition:transform .2s}.pin:hover{transform:translate(-50%,-115%) scale(1.1)}.pin.sel{animation:ping 1.8s infinite}
.toast{animation:toast .4s cubic-bezier(.2,1.4,.4,1)}.sr:focus-within,input:focus,select:focus{box-shadow:0 0 0 3px #7047eb44;outline:0}
.land nav{position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);background:#f8f7ffcc}
.hero{background:linear-gradient(160deg,var(--lav),var(--bg),#e0f6f4,var(--lav));background-size:300% 300%;animation:shim 14s ease infinite}
.hero h1{background:linear-gradient(90deg,var(--tx),var(--p),var(--tx));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.hero .card{animation:bob 6s ease-in-out infinite}.flow span{animation:chip 6s infinite}.flow span:nth-child(2){animation-delay:1s}.flow span:nth-child(3){animation-delay:2s}.flow span:nth-child(4){animation-delay:3s}.flow span:nth-child(5){animation-delay:4s}.flow span:nth-child(6){animation-delay:5s}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s);
const ST=['Confirmed','Queued','Printing','Packing','Ready for Pickup','Collected'];
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};

const EMPTY={ses:null,u:[],k:[],o:[],n:[],tk:[],taken:{},stats:{}};let S=EMPTY;
const SAMPLE=[{file:'DBMS_Notes.pdf',pages:24,cfg:{color:0,dbl:1,copies:1,paper:'A4'},kiosk:1,slot:'Tomorrow 11:00',total:41,code:'8XUI-Z123',st:3,pay:'PAY-1001'},{file:'Resume.pdf',pages:2,cfg:{color:1,dbl:0,copies:2,paper:'A4'},kiosk:2,slot:'ASAP',total:47,code:'K2MP-77QD',st:5,pay:'PAY-1000',col:'Operator Ravi'}];
async function api(p,o={}){const fd=o.b instanceof FormData;const res=await fetch('/api'+p,{method:o.m||'GET',credentials:'same-origin',headers:fd||!o.b?{}:{'Content-Type':'application/json'},body:fd?o.b:o.b?JSON.stringify(o.b):undefined});const j=await res.json().catch(()=>({}));if(!res.ok)throw new Error(j.error||'Request failed');return j}
async function boot(){try{S=await api('/bootstrap')}catch(e){S=EMPTY}}
const act=async fn=>{try{await fn()}catch(e){toast(e.message)}};
const sync=async()=>{await boot();r()};
const me=()=>S.u.find(u=>u.id===S.ses),kn=id=>S.k.find(k=>k.id==id)?.n||'-';
const toast=m=>{$('#t').innerHTML=`<div class=toast>${m}</div>`;setTimeout(()=>$('#t').innerHTML='',2400)};
const go=h=>{location.hash=h};
let W={step:1,file:null,pages:0,cfg:{color:0,dbl:0,copies:1,paper:'A4',range:'all',oe:'all',orient:'Portrait'},kiosk:1,mode:'Scheduled',slot:null,day:day(1)},F='';
function selPages(){const{range,oe}=W.cfg;let n=W.pages,set=[];if(range==='all'||!range)for(let i=1;i<=n;i++)set.push(i);else range.split(',').forEach(p=>{const[a,b]=p.split('-').map(Number);if(a)for(let i=a;i<=(b||a)&&i<=n;i++)set.push(i)});
if(oe==='odd')set=set.filter(i=>i%2);if(oe==='even')set=set.filter(i=>!(i%2));return set.length}
function price(){const c=W.cfg;let p=selPages()*c.copies*(c.color?8:2);if(c.dbl)p*=.85;if(c.paper==='A3')p*=2;if(W.mode==='Instant')p+=15;return Math.round(p)}
function slotsTaken(k,s){return S.taken[k+'|'+s]||0}
const ic={Home:'⌂',Upload:'⇪','My Orders':'▤','Kiosk Locator':'⌖','Wallet & Payments':'▣',Settings:'⚙','Help & Support':'?'};
function shell(items,cur,body,title){const u=me();return`<div class=app><aside class=side><div class=logo style="margin:0 8px 22px"><i>🖨</i>Q-Zero</div>${items.map(([l,h])=>`<a class="${cur===h?'on':''}" onclick="go('${h}')"><b>${ic[l]||'•'}</b>${l}</a>`).join('')}<div style="flex:1"></div>${u.role=='student'?`<div class=promo><h4>Smart Campus Printing</h4><div style="font-size:13px;opacity:.85">Upload • Pay • Collect</div><button onclick="go('#/kiosks')">Go to Kiosk Map →</button></div>`:''}<a onclick="out()">Log out</a></aside><main class=main><div class=top><div class=sr><span>🔍</span><input placeholder="Search orders, kiosks…" oninput="F=this.value;if(location.hash=='#/orders')r()" value="${F}"></div>${u.role=='student'?`<button class=bell onclick="go('#/notifs')">🔔<b>${S.n.filter(n=>n.uid===u.id).length}</b></button>`:`<span class=mut>${u.role}</span>`}<div class=av title="${u.role=='student'?'Settings':'Home'}" onclick="go('${u.role=='student'?'#/settings':'#/'}')">${u.name[0]}</div></div>${body}</main></div>`}
const SI=[['Home','#/home'],['Upload','#/upload'],['My Orders','#/orders'],['Kiosk Locator','#/kiosks'],['Wallet & Payments','#/wallet'],['Settings','#/settings'],['Help & Support','#/support']];
const tl=s=>`<div class=tl>${ST.map((_,i)=>`<div class="${i<=s?'d':''}"></div>`).join('')}</div>`;
const pill=s=>`<span class="pill ${s>=4?'ok':s>0?'bl':'gy'}">${ST[s]}</span>`;
function out(){api('/auth/logout',{m:'POST'}).catch(()=>{}).finally(async()=>{await boot();location.hash==='#/'?r():go('#/')})}
function login(e,pw){act(async()=>{await api('/auth/login',{m:'POST',b:{email:e,password:pw}});await boot();const u=me();go(u.role==='admin'?'#/admin':u.role==='operator'?'#/op':'#/home')})}
function reg(){const f=id=>$('#'+id).value.trim();if(f('rp').length<6||!f('rn')||!f('rr')||!f('re'))return toast('Fill all fields; password needs 6+ characters');
act(async()=>{const j=await api('/auth/register',{m:'POST',b:{name:f('rn'),email:f('re'),reg:f('rr'),password:f('rp')}});window.OTP={e:f('re').toLowerCase(),o:j.devOtp||''};r()})}
function vot(){act(async()=>{await api('/auth/verify-otp',{m:'POST',b:{email:OTP.e,otp:$('#otp').value.trim()}});window.OTP=null;await boot();go('#/home')})}
function pick(f){if(!f)return;if(f.size>10*1024*1024)return toast('File too large (max 10 MB)');const fd=new FormData();fd.append('file',f);act(async()=>{const j=await api('/documents',{m:'POST',b:fd});W.file={name:j.name,size:j.size,id:j.id};W.pages=j.pages;toast('Uploaded: '+j.pages+' pages');r()})}
function cfg(k,v){W.cfg[k]=k==='copies'?Math.max(1,+v||1):v;r()}
function pay(){act(async()=>{const j=await api('/orders',{m:'POST',b:{documentId:W.file.id,cfg:{...W.cfg},kioskId:W.kiosk,mode:W.mode,slot:W.mode==='Instant'?null:W.slot}});W={step:1,file:null,pages:0,cfg:{color:0,dbl:0,copies:1,paper:'A4',range:'all',oe:'all',orient:'Portrait'},kiosk:1,mode:'Scheduled',slot:null,day:day(1)};await boot();toast('Paid. Tracking code '+j.code);go('#/orders')})}
function adv(id){act(async()=>{await api('/admin/orders/'+id+'/advance',{m:'POST'});await sync()})}

<div class=cols><div class=card><h3>Printing queue (advance status)</h3>${S.o.map(o=>ordRow(o,1)).join('')}</div><div class=stack><div class=card><h3>Kiosks</h3>${S.k.map(k=>`<div class=row>${k.n}<button class="btn s ${k.on?'':'o'}" onclick="kt(${k.id})">${k.on?'Online':'Offline'}</button></div>`).join('')}</div>
<div class=card><h3>Support tickets</h3>${S.tk.map(t=>`<div class=row>${t.cat}: ${t.m}<button class="btn s o" onclick="tt(${t.id})">${t.st}</button></div>`).join('')||'<p class=mut>None.</p>'}</div></div></div>`)}
if(h==='#/op'&&u.role==='operator')return shell([['Operator','#/op']],h,`<h2 style="margin-bottom:14px">Kiosk operator: secure collection</h2><div class=card style="max-width:480px"><label>Tracking code</label><input id=tc placeholder=8XUI-Z123><label>Student registration number (from ID card)</label><input id=rg placeholder=21CS1042><label><input type=checkbox id=ck1 style="width:auto"> Code matches sealed envelope</label><label><input type=checkbox id=ck2 style="width:auto"> University ID checked</label><br><button class="btn g" onclick="collect()">Confirm handover</button><p class=mut>If anything looks suspicious, ask for the student's OTP before handing over.</p></div><div class=card style="margin-top:16px"><h3>Ready for pickup</h3>${S.o.filter(o=>o.st==4).map(o=>ordRow(o)).join('')||'<p class=mut>None right now. Ask the admin to advance an order. Printing and packing are simulated.</p>'}</div>`);
go('#/login');return''}
function r(){try{const hh=location.hash;$('#app').className=hh!==window._lh?'fresh':'';window._lh=hh;$('#app').innerHTML=R()}catch(e){$('#app').innerHTML='<p style="padding:20px">Something went wrong. <a onclick="location.reload()">Reset demo data</a></p>'}}
boot().then(()=>{addEventListener('hashchange',r);r()});
</script></body></html>
